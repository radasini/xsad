<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <title>Dodawanie zdjęcia</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      margin: 50px;
    }
    #preview {
      margin-top: 20px;
      max-width: 400px;
      max-height: 400px;
      border: 2px dashed #666;
      padding: 10px;
    }
    img {
      max-width: 100%;
      max-height: 100%;
    }
  </style>
</head>
<body>
  <h1>Dodaj swoje zdjęcie</h1>
  <input type="file" id="fileInput" accept="image/*">
  <div id="preview">
    <p>Podgląd zdjęcia pojawi się tutaj</p>
  </div>

  <script>
    const fileInput = document.getElementById("fileInput");
    const preview = document.getElementById("preview");

    fileInput.addEventListener("change", function(event) {
      const file = event.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function(e) {
          preview.innerHTML = `<img src="${e.target.result}" alt="Podgląd zdjęcia">`;
        };
        reader.readAsDataURL(file);
      } else {
        preview.innerHTML = "<p>Podgląd zdjęcia pojawi się tutaj</p>";
      }
    });
  </script>
</body>
</html>
